<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ラジオお便り表示</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================================
           ページ全体
           ========================================= */

        body {

            margin: 0;

            width: 100vw;
            height: 100vh;

            font-family:
                "Noto Sans JP",
                "Yu Gothic",
                "Meiryo",
                sans-serif;

            /*
             * OBSのクロマキー用背景
             */
            background: #00ff00;

            color: white;

            overflow: hidden;
        }


        /* =========================================
           お便り表示画面
           ========================================= */

        .screen {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 40px;
        }


        /* =========================================
           お便り枠
           ========================================= */

        .letter {

            width: min(1100px, 90vw);

            /*
            * ウィンドウの高さに合わせて伸縮
            */
            height: calc(100vh - 80px);

            /*
            * 横方向・縦方向とも画面外には出さない
            */
            max-width: 1100px;
            max-height: calc(100vh - 80px);

            background:
                rgba(255, 255, 255, 0.96);

            color: #222;

            border-radius: 30px;

            padding: 45px 55px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);

            display: none;

            /*
            * 中身を縦方向に配置
            */
            flex-direction: column;

            /*
            * 枠の外にはみ出さない
            */
            overflow: hidden;

            animation:
                showLetter 0.35s ease;
        }

        .letter.show {

            display: flex;
        }


        @keyframes showLetter {

            from {

                opacity: 0;

                transform:
                    scale(0.96)
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================================
           ヘッダー
           ========================================= */

        .header {

            display: flex;

            align-items: center;

            gap: 25px;

            margin-bottom: 30px;

            /*
             * 名前部分を縮めすぎない
             */
            flex-shrink: 0;
        }


        /* =========================================
           アイコン
           ========================================= */

        .icon {

            width: 90px;
            height: 90px;

            border-radius: 50%;

            object-fit: cover;

            background: #e5e7eb;

            flex-shrink: 0;
        }


        /* =========================================
           名前
           ========================================= */

        .name {

            font-size: 30px;

            font-weight: bold;

            /*
             * 長い名前でも横にはみ出さない
             */
            word-break: break-word;
        }


        .label {

            font-size: 15px;

            color: #888;

            margin-bottom: 5px;
        }


        /* =========================================
           コメント
           ========================================= */

        .comment {

            font-size: 32px;

            line-height: 1.7;

            /*
            * 横幅に合わせて自動改行
            */
            white-space: pre-wrap;

            word-break: break-word;

            /*
            * コメント部分だけ残りの高さを使用
            */
            flex: 1;

            min-height: 0;

            /*
            * 入りきらない部分は隠す
            */
            overflow: hidden;
        }


        /* =========================================
           メッセージ
           ========================================= */

        .message {

            text-align: center;

            color:
                rgba(0, 0, 0, 0.7);

            font-size: 28px;
        }


        /* =========================================
           操作パネル
           ========================================= */

        .control-panel {

            position: fixed;

            left: 20px;
            bottom: 20px;

            width: 340px;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.85);

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.4);

            z-index: 1000;

            transition:
                opacity 0.2s;
        }


        .control-panel.hidden {

            opacity: 0;

            pointer-events: none;
        }


        .control-panel h2 {

            margin:
                0 0 15px 0;

            font-size: 20px;
        }


        .control-panel label {

            display: block;

            margin-bottom: 6px;

            font-size: 14px;
        }


        .control-panel input {

            width: 100%;

            padding: 10px 12px;

            margin-bottom: 12px;

            border: none;

            border-radius: 8px;

            font-size: 16px;
        }


        /* =========================================
           ボタン
           ========================================= */

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #1d4ed8;
        }


        /* =========================================
           前へ・次へ
           ========================================= */

        .navigation {

            display: flex;

            gap: 8px;

            margin-top: 8px;
        }


        .navigation button {

            width: 50%;
        }


        /* =========================================
           ステータス
           ========================================= */

        .status {

            margin-top: 12px;

            font-size: 13px;

            color: #ccc;

            min-height: 20px;

            line-height: 1.5;
        }


        /* =========================================
           操作説明
           ========================================= */

        .hint {

            margin-top: 12px;

            font-size: 12px;

            color: #aaa;

            line-height: 1.6;
        }

    </style>

</head>


<body>


    <!-- =========================================
         お便り表示
         ========================================= -->

    <div class="screen">


        <!-- 初期メッセージ -->

        <div
            id="message"
            class="message"
        >

            シート名を入力して
            「お便りを読み込む」を押してください

        </div>


        <!-- お便り -->

        <div
            id="letter"
            class="letter"
        >


            <!-- 名前 -->

            <div class="header">


                <!-- アイコン -->

                <img
                    id="icon"
                    class="icon"
                    src=""
                    alt="アイコン"
                >


                <div>

                    <div class="label">
                        ラジオネーム
                    </div>


                    <div
                        id="name"
                        class="name"
                    >
                    </div>

                </div>

            </div>


            <!-- コメント -->

            <div
                id="comment"
                class="comment"
            >
            </div>


        </div>

    </div>



    <!-- =========================================
         操作パネル
         ========================================= -->

    <div
        id="controlPanel"
        class="control-panel"
    >


        <h2>
            ラジオお便り操作
        </h2>


        <!-- シート名 -->

        <label for="sheetName">

            シート名

        </label>


        <input
            id="sheetName"
            type="text"
            placeholder="例：お便り"
        >


        <!-- 読み込み -->

        <button id="loadButton">

            お便りを読み込む

        </button>


        <!-- 前へ・次へ -->

        <div class="navigation">


            <button id="previousButton">

                ← 前のお便り

            </button>


            <button id="nextButton">

                次のお便り →

            </button>


        </div>


        <!-- ステータス -->

        <div
            id="status"
            class="status"
        >
        </div>


        <!-- 操作説明 -->

        <div class="hint">

            Space：次のお便り<br>

            ←：前のお便り<br>

            →：次のお便り<br>

            H：操作パネル表示 / 非表示

        </div>


    </div>



    <script>


        /* =====================================================
           Google Sheets設定
           ===================================================== */


        /*
         * Google SheetsのURLは固定
         */

        const SHEET_URL =
            "https://docs.google.com/spreadsheets/d/1oDB_-kaK9ltjHbQ1zHvB-Q8bYZoEzbnSMkKZgUo5H4o/edit";



        /* =====================================================
           アイコン
           ===================================================== */

        const ICONS = [

            "icons/icon1.png",

            "icons/icon2.png",

            "icons/icon3.png",

            "icons/icon4.png",

            "icons/icon5.png"

        ];



        /* =====================================================
           お便りデータ
           ===================================================== */

        let letters = [];


        /*
         * 現在表示しているお便り
         *
         * -1 = まだ表示していない
         */

        let currentIndex = -1;



        /* =====================================================
           HTML要素
           ===================================================== */

        const sheetNameInput =
            document.getElementById(
                "sheetName"
            );


        const loadButton =
            document.getElementById(
                "loadButton"
            );


        const previousButton =
            document.getElementById(
                "previousButton"
            );


        const nextButton =
            document.getElementById(
                "nextButton"
            );


        const status =
            document.getElementById(
                "status"
            );


        const message =
            document.getElementById(
                "message"
            );


        const letter =
            document.getElementById(
                "letter"
            );


        const nameElement =
            document.getElementById(
                "name"
            );


        const commentElement =
            document.getElementById(
                "comment"
            );


        const iconElement =
            document.getElementById(
                "icon"
            );


        const controlPanel =
            document.getElementById(
                "controlPanel"
            );



        /* =====================================================
           Spreadsheet ID取得
           ===================================================== */

        function getSpreadsheetId(url) {


            const match =
                url.match(
                    /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
                );


            if (!match) {

                throw new Error(
                    "Google Sheets URLが正しくありません"
                );

            }


            return match[1];

        }



        /* =====================================================
           CSV解析
           ===================================================== */

        function parseCSV(text) {


            const rows = [];

            let row = [];

            let value = "";

            let insideQuotes = false;


            for (
                let i = 0;
                i < text.length;
                i++
            ) {


                const char =
                    text[i];


                const next =
                    text[i + 1];


                /*
                 * ダブルクォート
                 */

                if (char === '"') {


                    if (
                        insideQuotes &&
                        next === '"'
                    ) {

                        value += '"';

                        i++;

                    }
                    else {

                        insideQuotes =
                            !insideQuotes;

                    }


                    continue;

                }



                /*
                 * カンマ
                 */

                if (
                    char === "," &&
                    !insideQuotes
                ) {

                    row.push(value);

                    value = "";

                    continue;

                }



                /*
                 * 改行
                 */

                if (
                    (
                        char === "\n" ||
                        char === "\r"
                    ) &&
                    !insideQuotes
                ) {


                    /*
                     * CRLF
                     */

                    if (
                        char === "\r" &&
                        next === "\n"
                    ) {

                        i++;

                    }


                    row.push(value);

                    rows.push(row);

                    row = [];

                    value = "";

                    continue;

                }


                value += char;

            }



            /*
             * 最後の行
             */

            if (
                value !== "" ||
                row.length > 0
            ) {

                row.push(value);

                rows.push(row);

            }


            return rows;

        }



        /* =====================================================
           Google Sheets読み込み
           ===================================================== */

        async function loadSheet() {

            const sheetName =
                sheetNameInput.value.trim();


            /*
             * シート名が空
             */

            if (!sheetName) {

                status.textContent =
                    "シート名を入力してください";

                return;

            }


            try {

                status.textContent =
                    "読み込み中...";


                /*
                 * Spreadsheet ID
                 */

                const spreadsheetId =
                    getSpreadsheetId(
                        SHEET_URL
                    );


                /*
                 * =====================================================
                 * スプレッドシートのHTMLを取得
                 * 指定されたシート名が存在するか確認
                 * =====================================================
                 */

                const spreadsheetResponse =
                    await fetch(
                        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit`
                    );


                if (!spreadsheetResponse.ok) {

                    throw new Error(
                        "SPREADSHEET_ACCESS_ERROR"
                    );

                }


                const spreadsheetHtml =
                    await spreadsheetResponse.text();


                /*
                 * シート名の存在確認
                 */

                if (
                    !spreadsheetHtml.includes(
                        sheetName
                    )
                ) {

                    throw new Error(
                        "SHEET_NOT_FOUND"
                    );

                }


                /*
                 * シート名をURLエンコード
                 */

                const encodedSheetName =
                    encodeURIComponent(
                        sheetName
                    );


                /*
                 * CSV取得
                 */

                const csvUrl =
                    `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodedSheetName}`;


                const response =
                    await fetch(csvUrl);


                if (!response.ok) {

                    throw new Error(
                        "SHEET_NOT_FOUND"
                    );

                }


                const csv =
                    await response.text();


                /*
                 * Google Sheets側のエラー確認
                 */

                if (
                    csv.includes(
                        "Unable to parse query string"
                    ) ||
                    csv.includes(
                        "Invalid query"
                    ) ||
                    csv.includes(
                        "Error"
                    )
                ) {

                    throw new Error(
                        "SHEET_NOT_FOUND"
                    );

                }


                /*
                 * CSV解析
                 */

                const rows =
                    parseCSV(csv);


                /*
                 * お便りを初期化
                 */

                letters = [];


                /*
                 * =====================================================
                 * A列 = 名前
                 * B列 = コメント
                 * =====================================================
                 */

                for (
                    let i = 0;
                    i < rows.length;
                    i++
                ) {

                    const row =
                        rows[i];


                    const name =
                        row[0]?.trim() || "";


                    const comment =
                        row[1]?.trim() || "";


                    /*
                     * 完全な空行は無視
                     */

                    if (
                        name === "" &&
                        comment === ""
                    ) {

                        continue;

                    }


                    /*
                     * 1行目がヘッダーなら除外
                     */

                    if (
                        i === 0 &&
                        (
                            name === "名前" ||
                            name.toLowerCase() === "name"
                        ) &&
                        (
                            comment === "コメント" ||
                            comment.toLowerCase() === "comment"
                        )
                    ) {

                        continue;

                    }


                    /*
                     * お便りとして追加
                     */

                    letters.push({

                        name: name,

                        comment: comment

                    });

                }


                /*
                 * お便りが0件
                 */

                if (
                    letters.length === 0
                ) {

                    status.textContent =
                        "お便りがありません";

                    return;

                }


                /*
                 * 現在位置をリセット
                 */

                currentIndex = -1;


                /*
                 * 表示切り替え
                 */

                message.style.display =
                    "none";


                letter.classList.add(
                    "show"
                );


                /*
                 * 読み込み完了
                 */

                status.textContent =
                    `${letters.length}件のお便りを読み込みました`;


                /*
                 * 最初のお便り
                 */

                showNextLetter();


            }
            catch (error) {

                console.error(
                    error
                );


                /*
                 * シートが存在しない
                 */

                if (
                    error.message ===
                    "SHEET_NOT_FOUND"
                ) {

                    status.textContent =
                        `シート「${sheetName}」が存在しません`;

                    return;

                }


                /*
                 * その他のエラー
                 */

                status.textContent =
                    "お便りの読み込みに失敗しました";

            }

        }



        /* =====================================================
           次のお便り
           ===================================================== */

        function showNextLetter() {


            if (
                letters.length === 0
            ) {

                return;

            }


            /*
             * 最後のお便り
             */

            if (
                currentIndex >=
                letters.length - 1
            ) {

                status.textContent =
                    "これが最後のお便りです";

                return;

            }


            /*
             * 次へ
             */

            currentIndex++;


            showCurrentLetter();

        }



        /* =====================================================
           前のお便り
           ===================================================== */

        function showPreviousLetter() {


            if (
                letters.length === 0
            ) {

                return;

            }


            /*
             * 最初のお便り
             */

            if (
                currentIndex <= 0
            ) {

                status.textContent =
                    "これが最初のお便りです";

                return;

            }


            /*
             * 前へ
             */
            currentIndex--;

            showCurrentLetter();

        }



        /* =====================================================
           長いコメントを画面内に収める
           ===================================================== */
        function fitCommentToLetter() {

            const header =
                document.querySelector(".header");

            /*
            * コメントに使える高さを取得
            */
            const availableHeight = commentElement.clientHeight;

            if (availableHeight <= 0) {
                return;
            }

            /*
            * 元の全文を取得
            */
            const fullText = commentElement.dataset.fullText || "";

            /*
            * まず全文を表示
            */
            commentElement.textContent = fullText;

            /*
            * 全文が収まるならそのまま表示
            */

            if (
                commentElement.scrollHeight <= availableHeight
            ) {
                return;
            }


            /*
            * =========================================
            * 入りきらない場合
            *
            * 二分探索で表示できる最大文字数を探す
            * =========================================
            */

            let low = 0;

            let high =
                fullText.length;


            while (
                low < high
            ) {

                const mid = Math.ceil((low + high) / 2);

                /*
                * 最後に「…」を付ける
                */
                commentElement.textContent = fullText.slice(0,mid) + "…";

                /*
                * 高さに収まるか確認
                */
                if (
                    commentElement.scrollHeight <= availableHeight
                ) {
                    low = mid;
                }
                else {
                    high = mid - 1;
                }
            }

            /*
            * 最終的な表示
            */
            commentElement.textContent =
                fullText.slice(
                    0,
                    low
                ) + "…";
        }



        /* =====================================================
           現在のお便りを表示
           ===================================================== */

        function showCurrentLetter() {


            const current =
                letters[currentIndex];


            /*
             * 名前
             */

            nameElement.textContent =
                current.name;


            /*
             * コメント
             *
             * 元の全文を保存
             */

            commentElement.dataset.fullText =
                current.comment;


            commentElement.textContent =
                current.comment;


            /*
             * アイコン
             *
             * 毎回ランダム
             */

            setRandomIcon();


            /*
             * アニメーション
             */

            letter.classList.remove(
                "show"
            );


            void letter.offsetWidth;


            letter.classList.add(
                "show"
            );


            /*
             * アニメーション後に
             * コメントの高さを計算
             */

            requestAnimationFrame(
                function() {

                    fitCommentToLetter();

                }
            );


            /*
             * 現在位置
             */

            status.textContent =
                `${currentIndex + 1} / ${letters.length}`;

        }



        /* =====================================================
           ランダムアイコン
           ===================================================== */

        function setRandomIcon() {


            const randomIndex =
                Math.floor(
                    Math.random() *
                    ICONS.length
                );


            const imagePath =
                ICONS[randomIndex];


            iconElement.style.display =
                "block";


            iconElement.src =
                imagePath;


            /*
             * 画像がない場合
             */

            iconElement.onerror =
                function() {

                    iconElement.style.display =
                        "none";

                    iconElement.onerror =
                        null;

                };

        }



        /* =====================================================
           ボタン
           ===================================================== */

        loadButton.addEventListener(
            "click",
            loadSheet
        );


        nextButton.addEventListener(
            "click",
            showNextLetter
        );


        previousButton.addEventListener(
            "click",
            showPreviousLetter
        );



        /* =====================================================
           キーボード操作
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                /*
                 * 入力欄を操作中なら無視
                 */

                if (
                    document.activeElement.tagName ===
                    "INPUT"
                ) {

                    return;

                }


                /*
                 * Space
                 *
                 * 次のお便り
                 */

                if (
                    event.code === "Space"
                ) {

                    event.preventDefault();

                    showNextLetter();

                }


                /*
                 * →キー
                 */

                if (
                    event.key === "ArrowRight"
                ) {

                    showNextLetter();

                }


                /*
                 * ←キー
                 */

                if (
                    event.key === "ArrowLeft"
                ) {

                    showPreviousLetter();

                }


                /*
                 * Hキー
                 *
                 * 操作パネル表示/非表示
                 */

                if (
                    event.key.toLowerCase() ===
                    "h"
                ) {

                    controlPanel.classList.toggle(
                        "hidden"
                    );

                }

            }
        );



        /* =====================================================
           OBSウィンドウのサイズ変更
           ===================================================== */

        window.addEventListener(
            "resize",
            function() {

                if (
                    currentIndex >= 0 &&
                    letters.length > 0
                ) {

                    requestAnimationFrame(
                        fitCommentToLetter
                    );

                }

            }
        );


    </script>


</body>

</html>
